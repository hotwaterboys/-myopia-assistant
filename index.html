<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="近视验光助手">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>近视验光助手 Offline</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#152033;--muted:#6f7b8d;--line:#e5eaf1;--pri:#2563eb;--pri2:#eef4ff;--warn:#b87100}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
body{padding-bottom:env(safe-area-inset-bottom)} .app{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 12px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:22px;font-weight:800}.badge{font-size:11px;color:#536075;background:#eaf0f7;padding:5px 8px;border-radius:999px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 6px 18px rgba(25,40,70,.05)} .hero{background:linear-gradient(145deg,#fff,#f2f6ff)}
.hero h1{font-size:25px;margin:0 0 8px}.hero p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.mode{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px 14px;text-align:left;font-size:17px;font-weight:800}.mode span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:6px;line-height:1.45}.emoji{font-size:28px;margin-bottom:5px}
.section{display:none}.section.active{display:block}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px}.card{margin-top:13px}.title{font-weight:800;font-size:16px;margin-bottom:10px}
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:0;border-radius:15px;padding:16px 12px;font-size:16px;font-weight:800}.camera{background:var(--pri);color:#fff}.album{background:var(--pri2);color:#2357aa}
input[type=file]{display:none}.preview{display:none;width:100%;max-height:270px;object-fit:contain;border:1px solid var(--line);border-radius:14px;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;font-size:15px;background:#fff}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.pri{background:var(--pri);color:#fff}.sec{background:#edf1f6;color:#39455a}
.note{font-size:12px;line-height:1.6;color:#556173;background:#f7f9fc;border-radius:12px;padding:10px}.row{border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:8px}.eye{font-weight:800}.simple{font-size:13px;line-height:1.6;margin-top:6px}
.ruler{width:100%;border-collapse:collapse;font-size:12px}.ruler td,.ruler th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}.ruler td:first-child,.ruler th:first-child{text-align:left}.warn{display:inline-block;margin-top:6px;background:#fff4dd;color:var(--warn);padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}
.online{margin-top:12px;font-size:12px;color:var(--muted)}
@media(max-width:560px){.modes,.capture,.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">近视验光助手</div><div class="badge">Offline PWA v1</div></div>

  <section id="home" class="section active">
    <div class="hero">
      <h1>拍一下，先看重点。</h1>
      <p>安装到主屏幕后，核心计算可以离线运行。第一版先验证 iPhone 安装、离线打开、相机与计算流程。</p>
      <div class="modes">
        <button class="mode" onclick="go('follow')"><div class="emoji">📷</div>复查患者<span>历史记录 → 上次AL → 速查尺</span></button>
        <button class="mode" onclick="go('initial')"><div class="emoji">👁️</div>初查患者<span>AR + AL + K → 结构分析</span></button>
      </div>
      <div id="net" class="online"></div>
    </div>
    <div class="card">
      <div class="title">安装后测试</div>
      <div class="note">第一次用 Safari 打开并安装到主屏幕后，把手机切到飞行模式，再从桌面图标打开。如果仍能进入并计算，就说明离线 PWA 成功。</div>
    </div>
  </section>

  <section id="follow" class="section">
    <div class="top"><button class="back" onclick="go('home')">← 首页</button><b>复查患者</b></div>
    <div class="card">
      <div class="title">拍历史记录</div>
      <div class="capture">
        <button class="action camera" onclick="pick('fcam')">📷 直接拍照</button>
        <button class="action album" onclick="pick('falbum')">🖼️ 相册选择</button>
      </div>
      <input id="fcam" type="file" accept="image/*" capture="environment" onchange="preview(event,'fprev')">
      <input id="falbum" type="file" accept="image/*" onchange="preview(event,'fprev')">
      <img id="fprev" class="preview">
      <div class="note" style="margin-top:10px">本测试版暂不做OCR；先手动录入最近1–2次数据，验证离线使用是否稳定。</div>
    </div>
    <div class="card">
      <div class="title">最近历史</div>
      <div id="hist"></div>
      <div class="btnrow"><button class="btn sec" onclick="addHist()">+ 添加记录</button><button class="btn pri" onclick="buildFollow()">生成工作卡</button></div>
    </div>
    <div class="card"><div class="title">叫号前工作卡</div><div id="fres" class="note">等待历史数据。</div></div>
    <div class="card"><div class="title">患者进来后：眼轴速查</div><div class="grid2"><div><div class="eye">OD</div><div id="odr" class="note">—</div></div><div><div class="eye">OS</div><div id="osr" class="note">—</div></div></div></div>
  </section>

  <section id="initial" class="section">
    <div class="top"><button class="back" onclick="go('home')">← 首页</button><b>初查患者</b></div>
    <div class="card">
      <div class="title">拍本次检查页面</div>
      <div class="capture">
        <button class="action camera" onclick="pick('icam')">📷 直接拍照</button>
        <button class="action album" onclick="pick('ialbum')">🖼️ 相册选择</button>
      </div>
      <input id="icam" type="file" accept="image/*" capture="environment" onchange="preview(event,'iprev')">
      <input id="ialbum" type="file" accept="image/*" onchange="preview(event,'iprev')">
      <img id="iprev" class="preview">
    </div>
    <div class="card">
      <div class="title">本次数据</div>
      <div class="grid2">
        <div><div class="eye">OD</div><div class="grid3">
          <div><label>SPH</label><input id="ods" type="number" step="0.25"></div><div><label>CYL</label><input id="odc" type="number" step="0.25"></div><div><label>AX</label><input id="odax" type="number" step="1"></div>
          <div><label>AL</label><input id="odal" type="number" step="0.01"></div><div><label>K1</label><input id="odk1" type="number" step="0.01"></div><div><label>K2</label><input id="odk2" type="number" step="0.01"></div>
          <div><label>Km</label><input id="odkm" type="number" step="0.01"></div><div><label>角膜散光</label><input id="odca" type="number" step="0.25"></div>
        </div></div>
        <div><div class="eye">OS</div><div class="grid3">
          <div><label>SPH</label><input id="oss" type="number" step="0.25"></div><div><label>CYL</label><input id="osc" type="number" step="0.25"></div><div><label>AX</label><input id="osax" type="number" step="1"></div>
          <div><label>AL</label><input id="osal" type="number" step="0.01"></div><div><label>K1</label><input id="osk1" type="number" step="0.01"></div><div><label>K2</label><input id="osk2" type="number" step="0.01"></div>
          <div><label>Km</label><input id="oskm" type="number" step="0.01"></div><div><label>角膜散光</label><input id="osca" type="number" step="0.25"></div>
        </div></div>
      </div>
      <div class="btnrow"><button class="btn pri" onclick="buildInitial()">生成初查工作卡</button></div>
    </div>
    <div class="card"><div class="title">初查工作卡</div><div id="ires" class="note">等待数据。</div></div>
  </section>
</div>
<script>
let hist=[];
function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function pick(id){document.getElementById(id).click()}
function preview(e,id){const f=e.target.files&&e.target.files[0];if(!f)return;const im=document.getElementById(id);im.src=URL.createObjectURL(f);im.style.display='block'}
function num(v){return v===''?null:Number(v)} function fmt(v,d=2){return v==null||!Number.isFinite(v)?'—':v.toFixed(d)} function se(s,c){return s==null||c==null?null:s+c/2}
function addHist(v={}){hist.push({date:v.date||'',odse:v.odse??null,odal:v.odal??null,osse:v.osse??null,osal:v.osal??null});renderHist()}
function renderHist(){const b=document.getElementById('hist');b.innerHTML='';hist.forEach((r,i)=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<div class="grid3"><div><label>日期</label><input type="date" value="${r.date}" onchange="hist[${i}].date=this.value"></div><div><label>OD SE</label><input type="number" step="0.25" value="${r.odse??''}" onchange="hist[${i}].odse=num(this.value)"></div><div><label>OD AL</label><input type="number" step="0.01" value="${r.odal??''}" onchange="hist[${i}].odal=num(this.value)"></div><div><label>OS SE</label><input type="number" step="0.25" value="${r.osse??''}" onchange="hist[${i}].osse=num(this.value)"></div><div><label>OS AL</label><input type="number" step="0.01" value="${r.osal??''}" onchange="hist[${i}].osal=num(this.value)"></div><div><label>&nbsp;</label><button class="btn sec" onclick="hist.splice(${i},1);renderHist()">删</button></div></div>`;b.appendChild(d)});if(!hist.length)b.innerHTML='<div class="note">添加最近一次或两次记录。</div>'}
function slope(k){const p=hist.filter(r=>r.date&&r[k]!=null).sort((a,b)=>a.date.localeCompare(b.date));if(p.length<2)return null;const t0=new Date(p[0].date),xs=p.map(r=>(new Date(r.date)-t0)/86400000/365.25),ys=p.map(r=>r[k]);const xm=xs.reduce((a,b)=>a+b,0)/xs.length,ym=ys.reduce((a,b)=>a+b,0)/ys.length,den=xs.reduce((s,x)=>s+(x-xm)**2,0);if(!den)return null;return xs.reduce((s,x,i)=>s+(x-xm)*(ys[i]-ym),0)/den}
function word(x){if(x==null)return'数据不足';if(x<0)return'需复测';if(x<.20)return'相对稳定';if(x<.30)return'需关注';return'偏快'}
function ruler(base){if(base==null)return'缺少上次AL';let h=`<span class="warn">${(base-.05).toFixed(2)}–${(base+.05).toFixed(2)} 复测区</span><table class="ruler"><tr><th>本次AL</th><th>ΔAL</th><th>粗略量级</th></tr>`;[.05,.10,.15,.20,.25,.30].forEach(d=>h+=`<tr><td>${(base+d).toFixed(2)}</td><td>+${d.toFixed(2)}</td><td>${Math.round(d*200)}–${Math.round(d*300)}度</td></tr>`);return h+'</table>'}
function buildFollow(){const r=hist.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));if(!r.length)return;const l=r[r.length-1];document.getElementById('fres').innerHTML=`<div class="row"><b>OD</b><div class="simple">上次AL ${fmt(l.odal)} mm · 历史趋势 ${word(slope('odal'))}</div></div><div class="row"><b>OS</b><div class="simple">上次AL ${fmt(l.osal)} mm · 历史趋势 ${word(slope('osal'))}</div></div><div class="note">AL几乎没变而AR/SE突然更负：先复核调节与电脑验光；散光跳变先复测再主观验证。</div>`;document.getElementById('odr').innerHTML=ruler(l.odal);document.getElementById('osr').innerHTML=ruler(l.osal)}
function buildInitial(){const g=id=>num(document.getElementById(id).value);const od={s:g('ods'),c:g('odc'),ax:g('odax'),al:g('odal'),k1:g('odk1'),k2:g('odk2'),km:g('odkm'),ca:g('odca')},os={s:g('oss'),c:g('osc'),ax:g('osax'),al:g('osal'),k1:g('osk1'),k2:g('osk2'),km:g('oskm'),ca:g('osca')};function calc(e){const SE=se(e.s,e.c),km=e.km??((e.k1!=null&&e.k2!=null)?(e.k1+e.k2)/2:null),cr=km?337.5/km:null,ratio=e.al&&cr?e.al/cr:null,gap=e.c!=null&&e.ca!=null?Math.abs(Math.abs(e.ca)-Math.abs(e.c)):null;return{SE,km,cr,ratio,gap}}function card(nm,e,x){return`<div class="row"><b>${nm}</b><div class="simple">SE ${fmt(x.SE)}D · AL ${fmt(e.al)}mm · Km ${fmt(x.km)}D · CR ${fmt(x.cr)}mm · AL/CR ${x.ratio==null?'—':x.ratio.toFixed(3)}</div><div class="simple">AR ${e.s==null?'—':e.s.toFixed(2)} / ${e.c==null?'—':e.c.toFixed(2)} × ${e.ax??'—'} · 角膜散光 ${e.ca==null?'—':e.ca.toFixed(2)+'D'}</div>${x.gap!=null&&x.gap>=.75?'<span class="warn">散光差异较大，先复测</span>':''}</div>`}document.getElementById('ires').innerHTML=card('OD',od,calc(od))+card('OS',os,calc(os))+'<div class="note">先看AR是否重复稳定，再看AL与K/AL-CR结构是否说得通。</div>'}
function net(){document.getElementById('net').textContent=navigator.onLine?'当前：在线':'当前：离线（核心计算仍可用）'}window.addEventListener('online',net);window.addEventListener('offline',net);net();renderHist();addHist();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body></html>
